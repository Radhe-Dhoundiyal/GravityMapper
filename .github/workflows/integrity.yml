name: Verify GravityMapper integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gravitymapper_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gravitymapper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gravitymapper_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - name: Install Node dependencies
        run: npm ci --include=dev
      - name: Install scientific dependencies
        run: python -m pip install -r analysis/requirements.txt
      - name: Typecheck
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Sensor and CSV integrity tests
        run: npm run test:integrity
      - name: Gravity pipeline correctness tests
        run: npm run test:pipeline
      - name: PostgreSQL integration tests (dedicated database)
        run: npm run test:persistence
